name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 프리렌더 본문이 하이드레이션 뒤에도 화면에 남아 있는지 실제 브라우저로 확인한다.
      # 선언 단위 검사로는 안 잡히는 종류의 회귀라(스크립트도 뷰도 각자는 멀쩡해 보인다)
      # JS 끔/켬을 두 번 렌더해 비교하는 방법만이 판정이 된다.
      # 게이트가 API를 막고 돌기 때문에 네트워크 상태와 무관하게 결정적이다.
      - name: Install Chromium for parity gate
        run: npx playwright install --with-deps chromium

      - name: Validate hydration parity
        run: npm run validate:parity

      - name: Generate production SBOM
        run: npm run sbom:prod

      # 재생성 후 diff가 아니라 신원만 본다(타임스탬프·UUID·npm 버전 때문에 diff는 상시 red).
      # 네트워크 불필요, 1초 미만, 완전 결정적.
      - name: Verify vendored artifacts
        run: npm run verify:supply-chain

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-sbom
          path: client/artifacts/sbom/*.json
